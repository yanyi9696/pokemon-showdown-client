<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" preserveAspectRatio="none">
	<defs>
		<linearGradient id="warm" x2="1" y2="0">
			<stop stop-color="#83d24c"/>
			<stop offset=".24" stop-color="#d5d849"/>
			<stop offset=".44" stop-color="#efc249"/>
			<stop offset=".65" stop-color="#f9a055"/>
			<stop offset=".84" stop-color="#e77a95"/>
			<stop offset="1" stop-color="#ad73ca"/>
		</linearGradient>
		<linearGradient id="cool" x2="1" y2="0">
			<stop stop-color="#10abc9"/>
			<stop offset=".3" stop-color="#50becb"/>
			<stop offset=".56" stop-color="#6e9cd2"/>
			<stop offset=".8" stop-color="#8c7ad3"/>
			<stop offset="1" stop-color="#9764bd"/>
		</linearGradient>
		<linearGradient id="cool-opacity" x2="0" y2="1">
			<stop stop-color="#fff" stop-opacity="0"/>
			<stop offset=".18" stop-color="#fff" stop-opacity=".06"/>
			<stop offset=".7" stop-color="#fff" stop-opacity=".92"/>
			<stop offset="1" stop-color="#fff"/>
		</linearGradient>
		<mask id="lower-refraction">
			<path fill="url(#cool-opacity)" d="M0 0H300V48H0Z"/>
		</mask>
		<linearGradient id="glass" x2="0" y2="1">
			<stop stop-color="#fff" stop-opacity=".56"/>
			<stop offset=".24" stop-color="#fff" stop-opacity=".18"/>
			<stop offset=".55" stop-color="#fff" stop-opacity="0"/>
			<stop offset="1" stop-color="#234774" stop-opacity=".12"/>
		</linearGradient>
		<linearGradient id="reflection" x1="0" y1="0" x2=".5" y2="1">
			<stop stop-color="#fff" stop-opacity=".76"/>
			<stop offset="1" stop-color="#fff" stop-opacity=".06"/>
		</linearGradient>
	</defs>
	<!-- One continuous spectrum keeps the broad faces from becoming separate color tiles. -->
	<path fill="url(#warm)" d="M0 0H300V48H0Z"/>
	<path fill="url(#cool)" mask="url(#lower-refraction)" d="M0 0H300V48H0Z"/>
	<path fill="url(#glass)" d="M0 0H300V48H0Z"/>
	<!-- Reflections sit at the ends, leaving a calm central face behind the label. -->
	<path fill="url(#reflection)" d="M0 0H92L61 18 0 31Z"/>
	<path fill="#d6ffff" fill-opacity=".18" d="M0 31 61 18 94 48H0Z"/>
	<path fill="url(#reflection)" d="M208 0H300L253 25Z"/>
	<path fill="#f8eaff" fill-opacity=".2" d="M253 25 300 10V48H279Z"/>
	<path fill="none" stroke="#fff" stroke-opacity=".38" stroke-width=".7" d="M0 31 61 18 92 0M208 0 253 25 300 10"/>
</svg>
